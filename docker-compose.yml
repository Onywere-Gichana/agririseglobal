# PostgreSQL for local development (see PLAN.md Phase 1 & 2)
# Usage: docker compose up -d
# Then start the API from server/: npm run dev
services:
  postgres:
    image: postgres:16-alpine
    container_name: blog-post-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: blog_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d blog_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
